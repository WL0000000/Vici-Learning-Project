<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users & Approvals — Vici Learning</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/main.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/header :: header('Users & Approvals', 'Admin only')}"></div>

<div class="vici-layout">
    <script th:replace = "fragments/side-bar :: side-bar('admin-users')"></script>

    <main class="vici-main">

        <div th:if="${successMessage}" class="vici-panel mb-3" style="padding:12px 20px; border-left: 4px solid #2f8a6a;" th:text="${successMessage}">
            Saved.
        </div>

        <div class="vici-panel mb-3">
            <div class="vici-panel-header">
                <div>
                    <h2>Pending Approvals</h2>
                    <p th:text="${#lists.size(pendingUsers)} + ' request(s) awaiting review'">requests</p>
                </div>
            </div>

            <div th:each="u : ${pendingUsers}" class="flagged-row">
                <div class="flex-grow-1">
                    <div class="d-flex align-items-center gap-2">
                        <span class="flag-name" th:text="${u.username}">—</span>
                        <span class="badge-urgent">Pending</span>
                    </div>
                    <div class="flag-meta" th:text="'Requested ' + ${#temporals.format(u.createdAt, 'MMM d, yyyy h:mm a')}">—</div>
                </div>
                <div class="d-flex gap-2">
                    <form th:action="@{/admin/users/{id}/approve(id=${u.id})}" method="post" class="mb-0">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="btn-vici">Approve</button>
                    </form>
                    <form th:action="@{/admin/users/{id}/reject(id=${u.id})}" method="post" class="mb-0">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="btn-vici-outline">Reject</button>
                    </form>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(pendingUsers)}" class="text-center text-muted" style="padding:24px;">
                Nothing waiting on approval right now.
            </div>
        </div>

        <div class="vici-panel">
            <div class="vici-panel-header">
                <div>
                    <h2>All Accounts</h2>
                    <p th:text="${#lists.size(allUsers)} + ' account(s)'">accounts</p>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table sessions-table mb-0">
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Created</th>
                            <th>Change Role</th>
                            <th>Manage</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${allUsers}">
                            <td>
                                <div class="d-flex align-items-center gap-2">
                                    <div class="student-avatar" th:text="${#strings.substring(u.username, 0, 1)}">?</div>
                                    <div class="student-name" th:text="${u.username}">—</div>
                                </div>
                            </td>
                            <td class="text-muted" th:text="${u.role}">—</td>
                            <td>
                                <span class="status-pill" th:classappend="${u.approved} ? 'pill-confirmed' : 'pill-pending'"
                                      th:text="${u.approved} ? 'Approved' : 'Pending'">—</span>
                            </td>
                            <td class="text-muted" th:text="${#temporals.format(u.createdAt, 'MMM d, yyyy')}">—</td>
                            <td>
                                <form th:action="@{/admin/users/{id}/role(id=${u.id})}" method="post" class="d-flex gap-2 mb-0">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <select name="role" class="notion-edit-select">
                                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r}" th:selected="${r == u.role}"></option>
                                    </select>
                                    <button type="submit" class="btn-vici-outline">Save</button>
                                </form>
                            </td>
                            <td>
                                <div class="d-flex gap-2">
                                    <form th:action="@{/admin/users/{id}/toggle-access(id=${u.id})}" method="post" class="mb-0">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <button type="submit" class="btn-vici-outline" th:text="${u.approved} ? 'Pause' : 'Reactivate'">Pause</button>
                                    </form>
                                    <form th:action="@{/admin/users/{id}/delete(id=${u.id})}" method="post" class="mb-0"
                                          onsubmit="return confirm('Delete this account permanently? This can\'t be undone.');">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <button type="submit" class="btn-vici-outline" style="color: var(--vici-red); border-color: var(--vici-red);">Delete</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
