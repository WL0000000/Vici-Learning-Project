spring.datasource.url=jdbc:h2:mem:vici_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Tests run on in-memory H2 whose schema is built by Hibernate create-drop. Flyway's migrations are
# PostgreSQL-specific, so it is disabled here — the prod/dev Postgres path is what Flyway manages.
spring.flyway.enabled=false
brevo.api.url=http://localhost:8089
brevo.api.key=test-key